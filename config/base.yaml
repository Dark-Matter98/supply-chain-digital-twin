# Base scenario for the inbound line-feed twin.
# EVERY number here is illustrative: a synthetic plant sized to be plausible,
# not data from any real company. Units: minutes, hours (h), km, containers,
# units (pieces), USD.

seed_network: 7          # fixes supplier locations and part data
warmup_days: 1           # day 0 is excluded from KPIs

line:
  jph: 50                # vehicles per hour at full speed (takt 1.2 min)
  prod_start_h: 6
  prod_end_h: 22         # 16 production hours/day -> 800 vehicles if never starved

network:
  n_suppliers: 15
  parts_per_supplier: 2  # 30 part numbers
  radius_km: [10, 65]    # straight-line distance plant -> supplier
  circuity: 1.3          # road km / straight-line km
  speed_kmh: 60
  usage_choices: [1, 1, 1, 2, 4]          # units per vehicle, drawn per part
  containers_per_hour: [0.5, 1.1]         # sets units/container at nominal JPH
  unit_value_median: 40                   # USD per unit (lognormal)
  unit_value_sigma: 1.2
  unit_value_clip: [2, 1500]
  travel_sigma: 0.15     # lognormal sigma of a leg's travel-time multiplier
  travel_sigma_spread: 0.0   # 0 = same sigma on every corridor (homogeneous)
  p_supplier_late: 0.05  # chance the load is not ready when the truck arrives
  supplier_late_mean_min: 40

fleet:
  n_trucks: 5
  capacity: 26           # containers (one container = one pallet position)
  dispatch_h: [4, 9, 14, 19]   # milk-run dispatch waves
  shift_of_wave: [0, 0, 1, 1]  # driver shift that runs each wave (early: 04/09, late: 14/19)

supplier_ops:
  load_fixed_min: 15     # per stop: paperwork, empties exchange
  load_per_container_min: 0.5

plant:
  gate_min: 5
  n_doors: 4
  n_crews: 2             # unload crews (forklift + receiver)
  unload_setup_min: 5
  unload_per_container_min: 1.2
  unload_cv: 0.2
  dock_out_min: 5        # pull out, seal, paperwork; truck still holds the door
  receiving_mean_min: 20 # scan / ASN check / put-away before the supermarket
  receiving_cv: 0.3
  operating_window_h: [4, 24]   # trucks, doors and crews scheduled here
  background_trucks_per_h: 1.5  # other inbound carriers sharing the dock
  background_containers: [10, 26]

tugger:
  capacity: 16           # containers per loop
  loop_min: 30           # departs supermarket every 30 min, drops at line mid-loop
  kanban_margin: 0.5     # alpha in K = ceil(d * 1.5 * loop * (1 + alpha)) + 1

traffic:
  rush_multiplier: 1.35
  rush_hours: [[7, 9], [16, 18]]

inventory:
  lead_margin_h: 0.0     # added to each route's planned lead time (plan.route_timing)
  ss_h: 2.0              # safety stock in production hours: the buffer knob
  initial_cover_h: 8.0   # supermarket stock at t = 0

planning:                # used to time routes and by the Phase 2 optimizer
  max_fill: 1.0          # plan routes up to full capacity. The 04:00 and 09:00 waves each need
                         # 120 containers on 5 x 26 = 130, so no lower fill is feasible at f = 4
  slack_min: 15          # a route must end this long before the truck's next wave
                         # (the naive plan's own longest route leaves 22-30 min; 45 would exclude it)
  dock_wait_min: 13      # planned wait for door + crew (Phase 1: gate-to-unload 18 min - 5 min gate)
  solution_limit: 2000   # OR-Tools guided local search stops after this many solutions (deterministic)
  time_limit_s: 120      # safety net only: hitting it raises an error (results must not depend on CPU speed)
  fast_time_limit_s: 60  # same, for frequency-search solves (savings construction alone can take 25 s on tight waves)

costs:
  truck_per_km: 1.20
  truck_per_day: 250.0   # lease per truck in the plan's fleet
  driver_per_h: 35.0
  driver_min_paid_h: 8.0 # each driver shift is paid at least 8 h
  overtime_factor: 1.5   # beyond 8 h of shift span (first dispatch to last door release)
  handling_per_container: 4.0
  carrying_rate_per_year: 0.20
  space_per_position_day: 1.50
  line_down_per_min: 5000.0
  premium_freight_fixed: 250.0     # Phase 3
  premium_freight_per_km: 3.0      # Phase 3
  disruption_per_change: 50.0      # Phase 3
  disruption_per_stop: 20.0        # Phase 3
